# Render blueprint for the web app — OPTIONAL.
#
# Use this only if you want both apps on Render. Hosting the frontend on Vercel
# instead is recommended on the free tier: a Vercel deployment never sleeps, so
# a judge never waits on a cold start. See the README for the comparison.
#
# This is a Node Web Service, NOT a Static Site: the app proxies /api/* to the
# backend (see next.config.ts), and a rewrite needs a server to perform it.
services:
  - type: web
    name: soapbox-web
    runtime: node
    # MUST match the plan the service is actually on. This service is Blueprint
    # managed, which makes this file the source of truth for the settings it
    # declares — a sync overwrites the dashboard, not the other way round. It
    # said `free` while the service ran on Starter, so the next sync would have
    # put the audience's screen back onto a plan that sleeps after fifteen idle
    # minutes.
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # `next start` reads Render's PORT and binds every interface.
    startCommand: npm start
    healthCheckPath: /prijava
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      # The API's URL, e.g. https://soapbox-api.onrender.com. A bare hostname
      # works too — `resolveBackendOrigin` adds the scheme. This cannot be
      # wired with `fromService` any more: the API lives in a different
      # repository, so it is not part of this blueprint.
      - key: BACKEND_ORIGIN
        sync: false
      # `/api` is same-origin through the rewrite — do not point this at the
      # backend's own domain, or the session cookie becomes third-party.
      - key: NEXT_PUBLIC_API_URL
        value: /api
